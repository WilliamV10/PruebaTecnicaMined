# =====================================================
# Configuración para Docker - Spring Boot
# Sistema de Gestión de Trámites Gubernamentales
# =====================================================

spring.application.name=tramites

# =====================================================
# CONFIGURACIÓN DE BASE DE DATOS (Override por ENV)
# =====================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/tramites}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones HikariCP
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=TramitesHikariPool
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# =====================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# =====================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# =====================================================
# CONFIGURACIÓN DE SWAGGER / OPENAPI
# =====================================================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# =====================================================
# CONFIGURACIÓN DEL SERVIDOR
# =====================================================
server.port=${SERVER_PORT:8081}
server.servlet.context-path=/

# =====================================================
# CONFIGURACIÓN DE ACTUATOR (Health Checks)
# =====================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# =====================================================
# CONFIGURACIÓN DE LOGGING
# =====================================================
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.tramites=${LOGGING_LEVEL_COM_TRAMITES:INFO}
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
